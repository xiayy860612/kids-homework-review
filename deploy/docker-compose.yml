version: "3.9"

services:
  nginx:
    image: nginx:alpine
    container_name: kids-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    restart: unless-stopped
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pg:
    image: postgres:18
    container_name: pg
    restart: unless-stopped
    environment:
      # default user: postgres
      POSTGRES_PASSWORD: s2u2m1234
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5432:5432"
    volumes:
      - ./pg/volumes:/var/lib/postgresql/18/docker

