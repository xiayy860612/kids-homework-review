name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Backend artifact name (e.g., backend-package-<sha>)'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: ${{ inputs.artifact_name }}
          workflow: pack-backend.yml
          path: ./artifacts

      - name: Verify checksum
        run: |
          cd artifacts
          sha256sum -c backend-package.sha256

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Upload package to remote server
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            artifacts/backend-package.tar.gz \
            artifacts/backend-package.sha256 \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/

      - name: Create environment file with AI secrets
        run: |
          cat > artifacts/.env.extra << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AI_API_BASE=${{ vars.AI_API_BASE }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          AI_MODEL=${{ vars.AI_MODEL }}
          EOF

      - name: Upload deploy script to remote server
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            backend/be-deploy.sh \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/

      - name: Upload AI secrets to remote server
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            artifacts/.env.extra \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/

      - name: Deploy on remote server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "bash /tmp/be-deploy.sh /tmp/backend-package.tar.gz /tmp/backend-package.sha256"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "docker ps -f name=kids-backend"

      - name: Health check
        run: |
          sleep 10
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "curl -f http://localhost:8080/health || exit 1"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
