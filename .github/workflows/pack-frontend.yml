name: Package Frontend

on:
  push:
    branches:
      - main
      - test-deploy
    paths:
      - 'frontend/**'
      - '.github/workflows/pack-frontend.yml'
  workflow_dispatch:

jobs:
  package-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: short_sha
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Lint with ESLint
      #   run: npm run lint

      # - name: Type check with TypeScript
      #   run: npx tsc --noEmit

      # - name: Run tests with Jest
      #   run: npm run test:coverage

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create deployment package
        run: |
          mkdir -p dist
          # Copy standalone output files (only what's needed for production)
          cp -r .next/standalone dist/
          cp -r .next/static dist/standalone/.next/static
          cp -r public dist/
          cp .env.local.example dist/ || true
          # Copy deployment files
          cp fe-deploy.sh dist/
          cp docker-entrypoint.sh dist/
          # Create tarball
          tar -czf frontend-package.tar.gz -C dist .
          # Generate checksum
          sha256sum frontend-package.tar.gz > frontend-package.sha256

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-${{ steps.short_sha.outputs.sha }}
          path: |
            frontend/frontend-package.tar.gz
            frontend/frontend-package.sha256
          retention-days: 30

      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: ./frontend/coverage/coverage-final.json
      #     flags: frontend
      #     fail_ci_if_error: false
